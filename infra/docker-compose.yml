version: '3.8'

services:
  svastha-ai:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: joshi343/svastha-ai:latest
    container_name: svastha-ai
    ports:
      - "80:80"
      - "8002:8002"
    environment:
      - PORT=8002
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: always
    volumes:
      - ../backend/storage/uploads:/app/backend/storage/uploads
      - ../backend/storage/db:/app/backend/storage/db
