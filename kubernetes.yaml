apiVersion: apps/v1
kind: Deployment
metadata:
  name: svasthya-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: svasthya-ai
  template:
    metadata:
      labels:
        app: svasthya-ai
    spec:
      containers:
      - name: svasthya-ai
        image: <YOUR_DOCKER_HUB_USERNAME>/svasthya-ai:latest
        ports:
        - containerPort: 80
        - containerPort: 8002
        env:
        - name: PORT
          value: "8002"
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: svasthya-secrets
              key: groq-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: svasthya-ai-service
spec:
  type: LoadBalancer
  ports:
  - name: frontend
    port: 80
    targetPort: 80
  - name: backend
    port: 8002
    targetPort: 8002
  selector:
    app: svasthya-ai
