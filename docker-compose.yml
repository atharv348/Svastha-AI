version: '3.8'

services:
  svasthya-ai:
    image: joshi343/svasthya-ai:latest
    container_name: svasthya-ai
    ports:
      - "80:80"
      - "8002:8002"
    environment:
      - PORT=8002
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: always
    volumes:
      - ./uploads:/app/backend/uploads
